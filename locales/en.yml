about:
  content: >
    # About Kit For Dev

    This wonderful website, made with ❤ by [Corentin Thomasset](https://corentin.tech?utm_source=kit4dev&utm_medium=about) , aggregates useful tools for developer and people working in IT. If you find it useful, please feel free to share it to people you think may find it useful too and don't forget to bookmark it in your shortcut bar!

    Kit For Dev is open-source (under the GPL-3.0 license) and free, and will always be, but it costs me money to host and renew the domain name. If you want to support my work, and encourage me to add more tools, please consider supporting by [sponsoring me](https://www.buymeacoffee.com/cthmsst).

    ## Technologies

    Kit For Dev is made in Vue.js (Vue 3) with the the Naive UI component library and is hosted and continuously deployed by Vercel. Third-party open-source libraries are used in some tools, you may find the complete list in the [package.json](https://github.com/kit4dev/kit4dev/blob/main/package.json) file of the repository.

    ## Found a bug? A tool is missing?

    If you need a tool that is currently not present here, and you think can be useful, you are welcome to submit a feature request in the [issues section](https://github.com/kit4dev/kit4dev/issues/new/choose) in the GitHub repository.

    And if you found a bug, or something doesn't work as expected, please file a bug report in the [issues section](https://github.com/kit4dev/kit4dev/issues/new/choose) in the GitHub repository.

